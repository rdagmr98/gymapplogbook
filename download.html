<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scarica GymApp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .card {
      text-align: center;
      padding: 48px 36px;
      max-width: 420px;
      width: 90%;
    }
    .logo {
      width: 100px;
      height: 100px;
      border-radius: 24px;
      margin: 0 auto 24px;
      display: block;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h1 {
      font-size: 2.2em;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #e2e8f0, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      color: #94a3b8;
      font-size: 1.05em;
      margin-bottom: 36px;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px 24px;
      border-radius: 16px;
      font-size: 1.1em;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 14px;
      transition: transform 0.15s, box-shadow 0.15s;
      cursor: pointer;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .btn-android {
      background: linear-gradient(135deg, #3ddc84, #00897b);
      color: #fff;
    }
    .btn-ios {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
    }
    .redirect-msg {
      margin-top: 24px;
      font-size: 0.85em;
      color: #64748b;
    }
    #spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="gymlogbook-favicon.png" alt="GymApp" onerror="this.style.display='none'">
    <h1>GymApp</h1>
    <p>Il tuo diario di allenamento personale.<br>Scaricalo gratis per il tuo dispositivo.</p>

    <a class="btn btn-android" href="https://play.google.com/store/apps/details?id=com.gianmarco.gym_app" id="android-btn">
      📱 Scarica su Android (Play Store)
    </a>
    <a class="btn btn-ios" href="https://rdagmr98.github.io/GymApp/" id="ios-btn">
      🍎 Apri su iPhone (Web App)
    </a>

    <p class="redirect-msg" id="redirect-msg"></p>
  </div>

  <script>
    var ua = navigator.userAgent || navigator.vendor || window.opera;
    var isAndroid = /android/i.test(ua);
    var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

    var msg = document.getElementById('redirect-msg');

    if (isAndroid) {
      msg.innerHTML = '<span id="spinner"></span>Reindirizzamento al Play Store...';
      setTimeout(function() {
        window.location.href = 'https://play.google.com/store/apps/details?id=com.gianmarco.gym_app';
      }, 1200);
    } else if (isIOS) {
      msg.innerHTML = '<span id="spinner"></span>Apertura Web App per iPhone...';
      setTimeout(function() {
        window.location.href = 'https://rdagmr98.github.io/GymApp/';
      }, 1200);
    } else {
      msg.textContent = 'Scegli la versione per il tuo dispositivo ↑';
    }
  </script>
</body>
</html>
