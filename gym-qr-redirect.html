<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymApp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }
    .container {
      text-align: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 2em;
      margin-bottom: 16px;
    }
    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg { margin-top: 20px; color: #aaa; font-size: 1.1em; }
  </style>
</head>
<body>
  <div class="container">
    <h1>GymApp</h1>
    <p class="msg"><span class="spinner"></span>Caricamento...</p>
  </div>

  <script>
    // Detect device
    var ua = navigator.userAgent || navigator.vendor || window.opera;
    var isAndroid = /android/i.test(ua);
    var isIOS = /ipad|iphone|ipod/i.test(ua) && !window.MSStream;

    if (isAndroid) {
      // Android → Play Store direct
      window.location.replace('https://play.google.com/store/apps/details?id=com.gianmarco.gym_app');
    } else if (isIOS) {
      // iOS → GymApp Web App
      window.location.replace('https://rdagmr98.github.io/GymApp/');
    } else {
      // Desktop → show both options
      document.querySelector('.msg').innerHTML = 'Scegli la tua piattaforma:';
      document.querySelector('.container').innerHTML = `
        <h1>GymApp</h1>
        <p style="color: #aaa; margin: 20px 0;">Seleziona il tuo dispositivo:</p>
        <a href="https://play.google.com/store/apps/details?id=com.gianmarco.gym_app" 
           style="display: inline-block; margin: 10px; padding: 14px 28px; border-radius: 8px; background: linear-gradient(135deg, #3ddc84, #00897b); color: #fff; text-decoration: none; font-weight: 700;">
          📱 Android
        </a>
        <a href="https://rdagmr98.github.io/GymApp/" 
           style="display: inline-block; margin: 10px; padding: 14px 28px; border-radius: 8px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; text-decoration: none; font-weight: 700;">
          🍎 iPhone
        </a>
      `;
    }
  </script>
</body>
</html>
