<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/gymapplogbook/">

  <script>
    // QR download redirect — runs before Flutter loads
    (function () {
      var p = window.location.pathname;
      if (p.endsWith('/download') || p.endsWith('/download.html') || p.endsWith('/download/')) {
        var ua = navigator.userAgent || navigator.vendor || '';
        var isAndroid = /android/i.test(ua);
        var isIOS = /ipad|iphone|ipod/i.test(ua) && !window.MSStream;
        if (isAndroid) {
          window.location.replace('https://play.google.com/store/apps/details?id=com.gianmarco.gym_app');
        } else if (isIOS) {
          window.location.replace('https://rdagmr98.github.io/GymApp/');
        } else {
          // Desktop: show simple redirect page
          document.open();
          document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>GymApp</title><style>body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#1a1a2e;font-family:system-ui,sans-serif;color:#fff;text-align:center}.c{padding:40px}.a{display:inline-block;margin:10px;padding:14px 28px;border-radius:14px;text-decoration:none;font-weight:700;font-size:1.1em}.g{background:linear-gradient(135deg,#3ddc84,#00897b);color:#fff}.p{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}</style></head><body><div class="c"><h1>GymApp</h1><p>Scegli la tua piattaforma:</p><a class="a g" href="https://play.google.com/store/apps/details?id=com.gianmarco.gym_app">&#x1F4F1; Android (Play Store)</a><br><a class="a p" href="https://rdagmr98.github.io/GymApp/">&#xF8FF; iPhone (Web App)</a></div></body></html>');
          document.close();
        }
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GymLogbook: scheda, timer e progressi allenamento per atleti.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymLogbook">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/gymlogbook-home-180.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="gymlogbook-favicon.png?v=2"/>

  <title>GymLogbook</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
