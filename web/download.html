<script>
/* Redirect automatico per piattaforma (Android -> Play Store, iOS -> GymApp Web).
   Eseguito subito: gli utenti mobile non vedono mai il fallback. */
(function(){
  var ua = navigator.userAgent || navigator.vendor || window.opera || '';
  var ANDROID = 'https://play.google.com/store/apps/details?id=com.gianmarco.gym_app';
  var IOS = 'https://rdagmr98.github.io/GymApp/';
  var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /android/i.test(ua);
  if (isAndroid) { location.replace(ANDROID); }
  else if (isIOS) { location.replace(IOS); }
})();
</script>

body{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;

.box{max-width:430px;width:100%}
.logo{width:88px;height:88px;margin:0 auto 18px;display:grid;place-items:center;border-radius:22px;

.sub{color:#9aa1ad;font-size:15px;margin-bottom:30px}
.btns{display:flex;flex-direction:column;gap:14px}
.btn{display:flex;align-items:center;gap:14px;justify-content:flex-start;text-align:left;text-decoration:none;color:#fff;
  padding:15px 20px;border-radius:16px;border:1px solid rgba(0,242,255,.18);
  background:linear-gradient(180deg,#0c0f15,#07090d);transition:.2s}
.btn:hover{border-color:#00F2FF;box-shadow:0 0 26px rgba(0,242,255,.35);transform:translateY(-2px)}
.btn.primary{background:#00F2FF;color:#001014;border-color:#00F2FF;box-shadow:0 0 26px rgba(0,242,255,.45)}
.btn svg{width:30px;height:30px;flex:none;fill:#00F2FF}
.btn.primary svg{fill:#001014}
.btn .t{display:flex;flex-direction:column;line-height:1.2}
.btn .t small{font-size:12px;opacity:.7;font-weight:600}
.btn .t span{font-size:18px;font-weight:800}
.btn .tag{margin-left:auto;font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;
  background:rgba(0,242,255,.14);color:#00F2FF;border:1px solid rgba(0,242,255,.3)}
.btn.primary .tag{background:rgba(0,16,20,.18);color:#001014;border-color:rgba(0,16,20,.25)}
.note{margin-top:22px;color:#6b727d;font-size:12.5px}
.redir{margin-bottom:18px;color:#00F2FF;font-size:13px;font-weight:700;display:none}
